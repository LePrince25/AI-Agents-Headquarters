import * as THREE from 'three';

// ---------------------------------------------------------------------------
// Utilitaires
// ---------------------------------------------------------------------------
const PI = Math.PI;
const TAU = PI * 2;

function graine(seed) {
  let t = seed >>> 0;
  return function () {
    t += 0x6D2B79F5;
    let r = Math.imul(t ^ (t >>> 15), 1 | t);
    r ^= r + Math.imul(r ^ (r >>> 7), 61 | r);
    return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
  };
}
const hasard = graine(20261121);

const cacheMats = new Map();
function mat(color, opts = {}) {
  const cle = color + '|' + JSON.stringify(opts);
  if (!cacheMats.has(cle)) {
    cacheMats.set(cle, new THREE.MeshStandardMaterial({
      color,
      roughness: 0.86,
      metalness: 0,
      ...opts,
    }));
  }
  return cacheMats.get(cle);
}

function box(w, h, d, color, x = 0, y = 0, z = 0, opts) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat(color, opts));
  m.position.set(x, y, z);
  m.castShadow = true;
  m.receiveShadow = true;
  return m;
}

function cyl(rt, rb, h, color, x = 0, y = 0, z = 0, seg = 16, opts) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), mat(color, opts));
  m.position.set(x, y, z);
  m.castShadow = true;
  m.receiveShadow = true;
  return m;
}

function plan(w, d, color, x = 0, y = 0, z = 0, opts) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, d), mat(color, { ...opts }));
  m.rotation.x = -PI / 2;
  m.position.set(x, y, z);
  m.receiveShadow = true;
  return m;
}

// ---------------------------------------------------------------------------
// Palette de l'île
// ---------------------------------------------------------------------------
const C = {

// ---------------------------------------------------------------------------

];

const RAYON_ILE = 35;
const RAYON_POLES = 20.5;

// ---------------------------------------------------------------------------
// Rendu
// ---------------------------------------------------------------------------
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.18;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xe9f2fa, 150, 340);

const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 1, 700);

const ciel = new THREE.Mesh(
  new THREE.SphereGeometry(420, 32, 16),
  new THREE.ShaderMaterial({
    side: THREE.BackSide,
    depthWrite: false,
    fog: false,
    uniforms: {
      haut: { value: new THREE.Color('#6fb0dd') },
      bas: { value: new THREE.Color('#f2f8fc') },
      decal: { value: 45 },
      expo: { value: 0.72 },
    },
    vertexShader: `
      varying vec3 vMonde;
      void main() {
        vec4 p = modelMatrix * vec4(position, 1.0);
        vMonde = p.xyz;
        gl_Position = projectionMatrix * viewMatrix * p;
      }
    `,
    fragmentShader: `
      uniform vec3 haut;
      uniform vec3 bas;
      uniform float decal;
      uniform float expo;
      varying vec3 vMonde;
      void main() {
        float h = normalize(vMonde + vec3(0.0, decal, 0.0)).y;
        gl_FragColor = vec4(mix(bas, haut, pow(max(h, 0.0), expo)), 1.0);
      }
    `,
  })
);
ciel.frustumCulled = false;
scene.add(ciel);

const hemi = new THREE.HemisphereLight(0xd6ebff, 0xead3ac, 1.05);
scene.add(hemi);

const soleil = new THREE.DirectionalLight(0xffdda8, 3.05);

soleil.shadow.mapSize.set(2048, 2048);
soleil.shadow.camera.left = -58;
soleil.shadow.camera.right = 58;
soleil.shadow.camera.top = 58;
soleil.shadow.camera.bottom = -58;
soleil.shadow.camera.near = 8;
soleil.shadow.camera.far = 180;
soleil.shadow.bias = -0.0004;
soleil.shadow.normalBias = 0.035;

const contre = new THREE.DirectionalLight(0xbcd8ef, 0.45);
contre.position.set(40, 22, -45);
scene.add(contre);

// ---------------------------------------------------------------------------
// Île : plateau, falaise, bord de sable
// ---------------------------------------------------------------------------
function teinterFacettes(geo, base, variance, seed) {
  const g = geo.toNonIndexed();
  const pos = g.attributes.position;
  const couleurs = new Float32Array(pos.count * 3);
  const r = graine(seed);
  const baseColor = new THREE.Color(base);
  for (let i = 0; i < pos.count; i += 3) {
    const c = baseColor.clone().multiplyScalar(1 + (r() - 0.5) * variance);
    for (let k = 0; k < 3; k++) {
      couleurs[(i + k) * 3] = c.r;
      couleurs[(i + k) * 3 + 1] = c.g;
      couleurs[(i + k) * 3 + 2] = c.b;
    }
  }
  g.setAttribute('color', new THREE.BufferAttribute(couleurs, 3));
  return g;
}

function textureHerbe() {
  const c = document.createElement('canvas');
  c.width = c.height = 256;
  const x = c.getContext('2d');
  x.fillStyle = '#8db55c';
  x.fillRect(0, 0, 256, 256);
  const r = graine(11);
  const teintes = ['#7da44e', '#8fb35e', '#73994a', '#94bc64', '#82a953'];
  for (let i = 0; i < 1100; i++) {
    x.fillStyle = teintes[Math.floor(r() * teintes.length)];
    x.globalAlpha = 0.35 + r() * 0.35;
    x.beginPath();
    x.arc(r() * 256, r() * 256, 0.8 + r() * 3.4, 0, TAU);
    x.fill();
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(10, 10);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  return t;
}

// Surface d'herbe

// Falaise
const niveaux = [

  { y: -9.6, r: 23.4 },
  { y: -12.2, r: 15.4 },

];

for (let i = 0; i < niveaux.length - 1; i++) {
  const a = niveaux[i], b = niveaux[i + 1];
  const geo = teinterFacettes(
    new THREE.CylinderGeometry(a.r, b.r, a.y - b.y, 14, 1, false),
    roches[i % roches.length],
    0.16,
    40 + i
  );
  const m = new THREE.Mesh(geo, mat(0xffffff, { vertexColors: true, flatShading: true, roughness: 0.95 }));
  m.position.y = (a.y + b.y) / 2;
  m.rotation.y = i * 0.13;
  m.castShadow = true;
  m.receiveShadow = true;
  ile.add(m);
}
const pointe = new THREE.Mesh(
  teinterFacettes(new THREE.ConeGeometry(7.2, 6.5, 14), 0x8f6d48, 0.18, 77),
  mat(0xffffff, { vertexColors: true, flatShading: true, roughness: 0.95 })

pointe.position.y = -18;
pointe.rotation.y = 0.4;
pointe.castShadow = true;
ile.add(pointe);

// Rochers suspendus
for (let i = 0; i < 9; i++) {
  const a = hasard() * TAU;
  const r = 8 + hasard() * 20;
  const roche = new THREE.Mesh(
    new THREE.DodecahedronGeometry(0.7 + hasard() * 1.6, 0),
    mat(roches[Math.floor(hasard() * roches.length)], { flatShading: true })
  );
  roche.position.set(Math.cos(a) * r, -11 - hasard() * 6, Math.sin(a) * r);
  roche.rotation.set(hasard() * PI, hasard() * PI, hasard() * PI);
  roche.castShadow = true;
  ile.add(roche);
}

// ---------------------------------------------------------------------------
// Sols : place centrale, anneau, allées, héliport
// ---------------------------------------------------------------------------
const place = new THREE.Mesh(

  mat(C.pierreClair, { roughness: 0.9 })

place.rotation.x = -PI / 2;

const anneau = new THREE.Mesh(

function allee(angleDeg) {

function plante(parent, x, z, echelle = 1) {
  const g = new THREE.Group();
  g.position.set(x, 0.34, z);
  g.add(cyl(0.24 * echelle, 0.18 * echelle, 0.34, C.terracotta, 0, 0.17, 0, 10));
  const verts = [0x6f9451, 0x7fa65c, 0x5f8347];
  for (let i = 0; i < 3; i++) {

      new THREE.IcosahedronGeometry((0.26 + hasard() * 0.12) * echelle, 0),
      mat(verts[i % verts.length], { flatShading: true })
    );
    f.position.set((hasard() - 0.5) * 0.3 * echelle, (0.55 + i * 0.22) * echelle, (hasard() - 0.5) * 0.3 * echelle);
    f.castShadow = true;
    g.add(f);

  parent.add(g);
  return g;

function etagere(parent, x, z, rot) {
  const g = new THREE.Group();

  g.add(box(1.3, 1.45, 0.36, C.boisClair, 0, 0.73, 0));

  const couleursLivres = [0xb98a63, 0x8d9a4c, 0xa65a4f, 0x5f8a9a, 0xc2a04a, 0x9a8a7a];
  for (let i = 0; i < 3; i++) {
    const y = 0.38 + i * 0.4;
    g.add(box(1.1, 0.04, 0.26, C.boisFonce, 0, y, 0.02));
    for (let j = 0; j < 5; j++) {

        -0.44 + j * 0.22, y + 0.02 + h / 2, 0.04));
    }
  }
  parent.add(g);
  return g;
}

const W = 10.6;

function pavillon(spec, index) {
  const g = new THREE.Group();
  const a = spec.angle * PI / 180;
  const x = Math.cos(a) * RAYON_POLES;
  const z = Math.sin(a) * RAYON_POLES;
  g.position.set(x, 0, z);
  g.rotation.y = Math.atan2(-Math.cos(a), -Math.sin(a));

  // dalle
  const dalle = box(W + 1.1, 0.34, D + 1.1, C.dalle, 0, 0.17, 0, { roughness: 0.94 });
  g.add(dalle);

  // plancher intérieur
  g.add(plan(W - 0.4, D - 0.4, spec.sol, 0, 0.35, 0, { roughness: 0.97 }));

  // murs et vitrages
  g.add(box(W, H, 0.3, C.mur, 0, 0.34 + H / 2, -D / 2 + 0.15));
  for (const cote of [-1, 1]) {
    g.add(box(0.3, 1.0, D, C.mur, cote * (W / 2 - 0.15), 0.84, 0));
    const verre = box(0.12, 1.22, D - 0.5, C.verre, cote * (W / 2 - 0.15), 1.98, 0, {
      transparent: true, opacity: 0.28, roughness: 0.18, metalness: 0, depthWrite: false, side: THREE.DoubleSide,
    });
    verre.castShadow = false;
    g.add(verre);
    for (const mz of [-D / 3, 0, D / 3]) {
      g.add(box(0.16, 2.4, 0.12, C.mur, cote * (W / 2 - 0.15), 1.54, mz));
    }
  }

  // façade ouverte + linteau
  for (const cote of [-1, 1]) {
    g.add(box((W - 2.6) / 2, 1.0, 0.3, C.mur, cote * (W / 4 + 0.65), 0.84, D / 2 - 0.15));
  }
  g.add(box(W, 0.34, 0.36, C.mur, 0, 0.34 + H - 0.17, D / 2 - 0.18));
  g.add(box(W, 0.12, 0.42, C.boisClair, 0, 0.34 + H + 0.02, D / 2 - 0.18));

  // poteaux
  for (const sx of [-1, 1]) {
    for (const sz of [-1, 1]) {
      g.add(box(0.34, H + 0.1, 0.34, C.mur, sx * (W / 2 - 0.17), 0.34 + (H + 0.1) / 2, sz * (D / 2 - 0.17)));
    }
  }

  // plaque de couleur au-dessus de la porte
  g.add(box(2.4, 0.34, 0.1, new THREE.Color(spec.accent).getHex(), 0, 0.34 + H + 0.24, D / 2 - 0.12));

  // rangée arrière
  const posteArriere = [
    { x: -2.35, z: -2.55, rot: 0 },
    { x: 2.35, z: -2.55, rot: 0 },
  ];
  // rangée avant
  const posteAvant = [
    { x: -2.35, z: 2.45, rot: PI },
    { x: 2.35, z: 2.45, rot: PI },
  ];

  const places = [
    ...posteArriere.map(p => ({ ...p, assis: true })),
    ...posteAvant.map(p => ({ ...p, assis: true })),
  ];

  const signature = spec.agents.length;

  places.forEach((p, i) => {
    if (i >= signature) return;
    bureau(g, p.x, p.z, p.rot);
    const bord = p.x < 0 ? p.x - 1.0 : p.x + 1.0;
    g.add(box(0.09, 0.92, 1.15, 0x9aa88a, bord, 0.8, p.z));
    g.add(box(0.14, 0.07, 1.2, C.boisClair, bord, 1.29, p.z));
  });

  // plantes et rangement
  plante(g, -W / 2 + 0.75, D / 2 - 0.8, 1);
  plante(g, W / 2 - 0.75, -D / 2 + 0.85, 0.85);
  plante(g, -W / 2 + 0.8, -D / 2 + 0.9, 0.7);

        for (let j = 0; j < 4; j++) {

      mur.add(box(2.6, 1.15, 0.08, C.blanc, 0, 1.5, 0));
      const teintes = [0x5f8a9a, 0x7d9b4e, 0xc2a04a];
      for (let i = 0; i < 5; i++) {
        const hb = 0.2 + hasard() * 0.55;
        mur.add(box(0.28, hb, 0.03, teintes[i % 3], -0.9 + i * 0.44, 1.0 + hb / 2, 0.06));
      }
      g.add(mur);
      break;
    }
    case 'bi': {
      // tableau de bord
      const mur = new THREE.Group();
      mur.position.set(2.9, 0.34, -D / 2 + 0.4);
      mur.add(box(2.5, 1.2, 0.08, 0x4a5054, 0, 1.55, 0, { roughness: 0.5 }));
      mur.add(box(2.3, 1.0, 0.02, 0xe8eef0, 0, 1.55, 0.05));
      for (let i = 0; i < 4; i++) {
        mur.add(box(0.34, 0.3 + i * 0.18, 0.02, 0x8a8095, -0.75 + i * 0.5, 1.15 + (0.3 + i * 0.18) / 2, 0.07));
      }
      g.add(mur);
      break;
    }
  }

  // rangement au fond
  if (spec.kind !== 'forge' && spec.kind !== 'bastion') {
    etagere(g, 0.45, -D / 2 + 0.6, 0);
  }

  // les agents à leur poste
  const agentsGroup = new THREE.Group();
  g.add(agentsGroup);
  const positions = [
    { x: -2.35, z: -1.78, rot: PI, assis: true },
    { x: 2.35, z: -1.78, rot: PI, assis: true },
    { x: -2.35, z: 1.68, rot: 0, assis: true },
    { x: 2.35, z: 1.68, rot: 0, assis: true },
  ];

  const groupes = [];
  spec.agents.forEach((a, i) => {
    const p = positions[i] || positions[0];
    const rot = p.rot;
    let ag;
    if (i < signature) {
      chaise(agentsGroup, p.x, p.z + (p.rot === 0 ? -0.08 : 0.08), rot);
      ag = agent(agentsGroup, p.x, p.z, rot, true, index * 3 + i);
    } else {
      ag = agent(agentsGroup, p.x + 0.6, p.z + 0.3, rot + 0.7, false, index * 3 + i);
    }
    groupes.push(ag);
  });

  ile.add(g);

  return { group: g, agentsGroupes: groupes };
}

// --- Le Quartier Général, au centre ---
function siegeCentral() {
  const g = new THREE.Group();
  const Wc = 14.2, Dc = 10.4, Hc = 2.8;

  const dalle = new THREE.Mesh(new THREE.CylinderGeometry(8.6, 8.9, 0.3, 40), mat(C.dalle, { roughness: 0.94 }));
  dalle.position.y = 0.15;
  dalle.receiveShadow = true;
  dalle.castShadow = true;
  g.add(dalle);

  g.add(plan(Wc, Dc, 0xdfc9a8, 0, 0.32, 0, { roughness: 0.9 }));

  // parois basses + vitrages
  g.add(box(Wc, 0.9, 0.3, C.mur, 0, 0.75, -Dc / 2));
  const verreFond = box(Wc - 0.6, 1.9, 0.1, C.verre, 0, 2.15, -Dc / 2, {
    transparent: true, opacity: 0.26, roughness: 0.15, depthWrite: false, side: THREE.DoubleSide,
  });
  verreFond.castShadow = false;
  g.add(verreFond);

  for (const cote of [-1, 1]) {
    g.add(box(0.3, 0.9, Dc, C.mur, cote * Wc / 2, 0.75, 0));
    const v = box(0.1, 1.9, Dc - 0.5, C.verre, cote * Wc / 2, 2.15, 0, {
      transparent: true, opacity: 0.26, roughness: 0.15, depthWrite: false, side: THREE.DoubleSide,
    });
    v.castShadow = false;
    g.add(v);
    for (const mz of [-Dc / 3, 0, Dc / 3]) {
      g.add(box(0.14, 2.7, 0.1, C.mur, cote * Wc / 2, 1.6, mz));
    }
  }
  for (const mx of [-Wc / 3, 0, Wc / 3]) {
    g.add(box(0.1, 2.7, 0.14, C.mur, mx, 1.6, -Dc / 2));
  }
  for (const cote of [-1, 1]) {
    g.add(box((Wc - 3.4) / 2, 0.9, 0.3, C.mur, cote * (Wc / 4 + 0.85), 0.75, Dc / 2));
  }
  for (const sx of [-1, 1]) {
    for (const sz of [-1, 1]) {
      g.add(box(0.36, Hc, 0.36, C.mur, sx * (Wc / 2 - 0.18), Hc / 2 + 0.3, sz * (Dc / 2 - 0.18)));
    }
  }
  g.add(box(Wc, 0.32, 0.36, C.mur, 0, Hc + 0.14, Dc / 2 - 0.18));

  // table de réunion
  const table = new THREE.Group();
  table.add(cyl(2.2, 2.2, 0.1, C.bois, 0, 0.98, 0, 40));
  table.children[0].scale.z = 0.66;
  table.add(cyl(0.5, 0.7, 0.86, C.boisFonce, 0, 0.5, 0, 16));
  g.add(table);

  for (let i = 0; i < 8; i++) {
    const ang = (i / 8) * TAU;
    const cx = Math.cos(ang) * 2.6;
    const cz = Math.sin(ang) * 1.75;
    chaise(g, cx, cz, -ang + PI / 2);
  }

  // écrans muraux
  g.add(box(2.0, 1.0, 0.08, 0x444b50, -3.1, 1.75, -Dc / 2 + 0.3, { roughness: 0.5 }));
  g.add(box(1.85, 0.85, 0.02, 0xe3eef0, -3.1, 1.75, -Dc / 2 + 0.35));
  g.add(box(1.6, 0.9, 0.08, 0x444b50, 2.8, 1.8, -Dc / 2 + 0.3, { roughness: 0.5 }));
  g.add(box(1.45, 0.75, 0.02, 0xe3eef0, 2.8, 1.8, -Dc / 2 + 0.35));

  plante(g, -Wc / 2 + 0.8, Dc / 2 - 0.9, 1.1);
  plante(g, Wc / 2 - 0.8, Dc / 2 - 0.9, 1.1);
  plante(g, -Wc / 2 + 0.8, -Dc / 2 + 0.9, 0.9);

  // Le DG, debout au bout de la table
  const dg = agent(g, 0, -2.6, 0, false, 2);

  ile.add(g);
  return { group: g, dg, dz: 0 };
}

function atelierDesAteliers() {
  const g = new THREE.Group();
  const a = 258 * PI / 180;
  g.position.set(Math.cos(a) * 27.2, 0, Math.sin(a) * 27.2);
  g.rotation.y = Math.atan2(-Math.cos(a), -Math.sin(a));

  const w = 6.4, d = 4.6, h = 2.3;
  g.add(box(w + 0.8, 0.28, d + 0.8, C.dalle, 0, 0.14, 0, { roughness: 0.95 }));
  g.add(plan(w - 0.5, d - 0.5, 0xddd2bd, 0, 0.29, 0, { roughness: 0.98 }));
  g.add(box(w, h, 0.28, C.mur, 0, 0.28 + h / 2, -d / 2 + 0.14));
  for (const cote of [-1, 1]) {
    g.add(box(0.28, 1.0, d, C.mur, cote * (w / 2 - 0.14), 0.78, 0));
  }
  g.add(box(w - 3.0, 1.0, 0.28, C.mur, -(w / 2 - (w - 3.0) / 4), 0.78, d / 2 - 0.14));
  for (const sx of [-1, 1]) {
    g.add(box(0.3, h, 0.3, C.mur, sx * (w / 2 - 0.15), 0.28 + h / 2, -d / 2 + 0.15));
  }

  // établi
  const etabli = new THREE.Group();
  etabli.position.set(0.2, 0.28, -1.15);
  etabli.add(box(3.4, 0.1, 0.9, C.bois, 0, 0.85, 0));
  for (const sx of [-1, 1]) {
    etabli.add(box(0.12, 0.85, 0.8, C.boisFonce, sx * 1.55, 0.42, 0));
  }
  etabli.add(box(0.5, 0.4, 0.4, C.metal, -0.9, 1.1, 0));
  etabli.add(box(0.3, 0.35, 0.3, C.terracotta, 0.6, 1.07, 0));
  etabli.add(box(0.7, 0.06, 0.4, 0x8a8f92, 1.1, 0.94, 0.1));
  g.add(etabli);

  // caisses
  for (let i = 0; i < 3; i++) {
    const cr = box(0.6, 0.6, 0.6, C.boisClair, -2.2 + i * 0.05, 0.58 + i * 0.58, 1.0);
    cr.rotation.y = i * 0.2;
    g.add(cr);
  }
  plante(g, 2.4, 1.2, 0.8);

  ile.add(g);
  return g;
}

  if (Math.hypot(x, z) > RAYON_ILE - 3.5) return false;

function cadrer() {
  const aspect = window.innerWidth / window.innerHeight;
  renderer.setSize(window.innerWidth, window.innerHeight);
  camera.aspect = aspect;
  const recul = aspect < 0.85 ? 1.5 : aspect < 1.2 ? 1.2 : 1;
  camera.position.set(53 * recul, 50 * recul, 53 * recul);
  camera.lookAt(0, -4.2, 0);
  camera.updateProjectionMatrix();
  mesurerLabels();
}
cadrer();
window.addEventListener('resize', cadrer);

const vProj = new THREE.Vector3();
const vMonde = new THREE.Vector3();

function mettreAJourLabels() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  const actifs = [];

  for (const l of labels) {
    l.objet.getWorldPosition(vMonde);
    vProj.copy(vMonde);
    vProj.y += l.dy;
    vProj.project(camera);
    const x = (vProj.x * 0.5 + 0.5) * w;
    const y = (-vProj.y * 0.5 + 0.5) * h;
    const visible = vProj.z < 1 && x > -220 && x < w + 220 && y > -100 && y < h + 100;
    if (!visible) {
      l.el.style.opacity = '0';
      continue;
    }
    l.ancreX = x;
    l.ancreY = y;
    actifs.push(l);
  }

  // anti-chevauchement : les étiquettes les plus hautes restent, les autres montent
  actifs.sort((a, b) => a.ancreY - b.ancreY);
  const poses = [];
  for (const l of actifs) {
    const largeur = l.w || 150;
    const hauteur = l.h || 42;
    let x = Math.min(Math.max(l.ancreX, largeur / 2 + 10), w - largeur / 2 - 10);
    let bas = l.ancreY;
    let bouge = true;
    let passes = 0;
    while (bouge && passes < 10) {
      bouge = false;
      passes++;
      for (const p of poses) {
        const procheX = Math.abs(x - p.x) < (largeur + p.largeur) / 2 + 6;
        const procheY = bas - hauteur < p.bas && bas > p.haut;
        if (procheX && procheY) {
          bas = p.haut - 6;
          bouge = true;
        }
      }
    }
    const haut = bas - hauteur;
    poses.push({ x, haut, bas, largeur });
    l.el.style.opacity = haut < 8 ? '0' : '1';
    l.el.style.transform = `translate3d(${(x - largeur / 2).toFixed(1)}px, ${haut.toFixed(1)}px, 0)`;
  }
}

const horloge = new THREE.Clock();

let temps = 0;
function animer() {
  const dt = Math.min(horloge.getDelta(), 0.1);
  temps += dt;
  const t = temps;

  for (const n of nuages) {
    n.position.x += n.userData.vitesse * dt;
    if (n.position.x > 110) n.position.x = -110;
  }

  for (const o of oiseaux) {
    const u = o.userData;
    const ang = u.phase + t * u.vitesse;
    o.position.set(Math.cos(ang) * u.r, u.y + Math.sin(t * 0.6 + u.phase) * 0.6, Math.sin(ang) * u.r);
    o.rotation.y = -ang;
    o.children[0].rotation.z = 0.35 + Math.sin(t * 6 + u.phase) * 0.5;
    o.children[1].rotation.z = -0.35 - Math.sin(t * 6 + u.phase) * 0.5;
  }

  mettreAJourLabels();
  renderer.render(scene, camera);
  requestAnimationFrame(animer);
}

animer();
</script>
